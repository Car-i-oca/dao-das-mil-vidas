name: Publicar site (v1 em / e teste v2 em /v2/)

# Esta esteira roda na branch reestruturacao: monta o site atual (da main) e a versão de teste (desta branch) juntos,
# para a v2 ficar em /v2/ sem tirar o jogo original do ar.
on:
  push:
    branches: [reestruturacao]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: reestruturacao, path: v2 }
      - uses: actions/checkout@v4
        with: { ref: main, path: v1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build v1 (jogo original)
        working-directory: v1
        run: |
          npm ci
          npm run build
      - name: Build v2 (teste)
        working-directory: v2
        run: |
          npm ci
          npm run validate
          npm run build:v2
      - name: Montar o site
        run: |
          mkdir site
          cp -r v1/dist/. site/
          mkdir site/v2
          cp -r v2/dist-v2/. site/v2/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
