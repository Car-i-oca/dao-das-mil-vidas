name: Gerar chave do APK (uso único)

# Cria a chave de assinatura do APK. O resultado sai criptografado com a chave pública em
# .github/keystore-cert.pem; só quem tem a chave privada (guardada fora do repositório) consegue abrir.
on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Gerar keystore e criptografar
        run: |
          P=$(openssl rand -hex 16)
          keytool -genkeypair -keystore ks.jks -storetype PKCS12 -storepass "$P" -keypass "$P" \
            -alias cultivo -keyalg RSA -keysize 2048 -validity 36500 \
            -dname "CN=Jogo de Cultivacao, O=Pessoal, C=BR"
          printf '%s' "$P" > pass.txt
          tar czf bundle.tgz ks.jks pass.txt
          openssl cms -encrypt -binary -aes256 -in bundle.tgz -out bundle.cms -outform DER .github/keystore-cert.pem
      - uses: actions/upload-artifact@v4
        with:
          name: keystore-criptografada
          path: bundle.cms
          retention-days: 1
