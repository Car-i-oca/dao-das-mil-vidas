name: APK Android (teste v2)

# VERSÃO DE TESTE (v2): compila o jogo reestruturado como outro app (outro nome e outro appId, para instalar ao lado do original)
# e publica o APK na Release "android-v2-latest". Roda só na branch reestruturacao.
# Assinatura: usa os segredos ANDROID_KEYSTORE_B64 e ANDROID_KEYSTORE_PASSWORD (alias "cultivo").
# Sem os segredos, gera uma chave temporária (o APK funciona, mas não atualiza por cima de outro).
on:
  workflow_dispatch:
  push:
    branches: [reestruturacao]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'sim/**'

permissions:
  contents: write

concurrency:
  group: android-v2
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      APK_NAME: dao-v2-teste.apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm run validate
      - run: npm run build:v2

      - name: Criar o projeto Android
        run: |
          # outro app: nome e identificador próprios (o nome definitivo sai de docs/nomes-v2.md)
          sed -i 's#"appId": "app.cultivo.jogo"#"appId": "app.cultivo.v2teste"#; s#"appName": "Murim Quest"#"appName": "Murim Quest (teste)"#; s#"webDir": "dist"#"webDir": "dist-v2"#' capacitor.config.json
          cat capacitor.config.json
          npx cap add android
          npx @capacitor/assets generate --android
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          # Metadados de autoria no APK (AndroidManifest)
          sed -z -i 's#\(<application[^>]*>\)#\1\n        <meta-data android:name="copyright" android:value="Murim Quest (c) 2026 Andre Barbosa Vieira. Todos os direitos reservados." />#' android/app/src/main/AndroidManifest.xml
          grep -c 'name="copyright"' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Compilar (release sem assinatura)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Assinar o APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -e
          if [ -n "$KS_B64" ]; then
            printf %s "$KS_B64" | tr -d '[:space:]' | base64 -d > ks.jks
            PASS=$(printf %s "$KS_PASS" | tr -d '[:space:]')
            NOTE="Assinatura fixa: pode ser instalado por cima da versão anterior."
          else
            PASS=temporaria
            keytool -genkeypair -keystore ks.jks -storetype PKCS12 -storepass "$PASS" -keypass "$PASS" -alias cultivo -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=temp"
            NOTE="ATENÇÃO: chave temporária. Desinstale a versão anterior antes de instalar esta."
          fi
          echo "NOTE=$NOTE" >> "$GITHUB_ENV"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          "$BT/zipalign" -f -p 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks ks.jks --ks-pass "pass:$PASS" --ks-key-alias cultivo --out "$APK_NAME" aligned.apk
          "$BT/apksigner" verify --print-certs "$APK_NAME" | head -3
          ls -la "$APK_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ env.APK_NAME }}

      - name: Publicar na Release android-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-v2-latest --yes --cleanup-tag || true
          gh release create android-v2-latest "$APK_NAME" \
            --title "App Android (APK) - teste v2" \
            --notes "APK do build ${{ github.run_number }} (commit ${GITHUB_SHA::7}). $NOTE Para instalar: abra esta página no celular Android, baixe o APK e permita a instalação de apps desta fonte."
